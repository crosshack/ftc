<script>
(function () {
  // Topics dataset lives in assets/js/topics-data.js (shared with index.html).
  var TOPICS = window.TOPICS_DATA;

  var PAGE_SIZE = 10;
  var state = { theme: "", tags: [], page: 1 };

  function getParam(name) {
    return new URLSearchParams(window.location.search).get(name) || "";
  }

  function uniqueThemes() {
    var seen = {}, list = [];
    TOPICS.forEach(function (t) {
      if (t.theme && !seen[t.theme.slug]) { seen[t.theme.slug] = true; list.push(t.theme); }
    });
    return list;
  }

  function uniqueTags() {
    var seen = {}, list = [];
    TOPICS.forEach(function (t) {
      t.tags.forEach(function (tag) {
        if (!seen[tag.slug]) { seen[tag.slug] = true; list.push(tag); }
      });
    });
    return list;
  }

  function buildFilterUI() {
    var themeContainer = document.getElementById("theme-filter");
    uniqueThemes().forEach(function (theme) {
      var btn = document.createElement("button");
      btn.type = "button";
      btn.className = "tag-pill";
      btn.textContent = theme.name;
      btn.dataset.slug = theme.slug;
      btn.addEventListener("click", function () {
        state.theme = state.theme === theme.slug ? "" : theme.slug;
        state.page = 1;
        render();
      });
      themeContainer.appendChild(btn);
    });

    var tagContainer = document.getElementById("tag-filter");
    uniqueTags().forEach(function (tag) {
      var btn = document.createElement("button");
      btn.type = "button";
      btn.className = "tag-pill";
      btn.textContent = "#" + tag.name;
      btn.dataset.slug = tag.slug;
      btn.addEventListener("click", function () {
        var idx = state.tags.indexOf(tag.slug);
        if (idx === -1) { state.tags.push(tag.slug); } else { state.tags.splice(idx, 1); }
        state.page = 1;
        render();
      });
      tagContainer.appendChild(btn);
    });

    function resetFilters() {
      state.theme = ""; state.tags = []; state.page = 1;
      render();
    }
    document.getElementById("filter-reset").addEventListener("click", resetFilters);
    document.getElementById("filter-reset-top").addEventListener("click", resetFilters);
  }

  function filtered() {
    return TOPICS.filter(function (t) {
      if (state.theme && (!t.theme || t.theme.slug !== state.theme)) return false;
      if (state.tags.length) {
        var tagSlugs = t.tags.map(function (tag) { return tag.slug; });
        for (var i = 0; i < state.tags.length; i++) {
          if (tagSlugs.indexOf(state.tags[i]) === -1) return false;
        }
      }
      return true;
    }).sort(function (a, b) { return a.date < b.date ? 1 : -1; });
  }

  function cardHTML(t) {
    var themeHTML = t.theme
      ? '<span class="theme-badge">' + t.theme.name + ' ・ ' + t.theme.part + '</span>'
      : '';
    var tagsHTML = t.tags.map(function (tag) {
      return '<a href="topics.html?tag=' + tag.slug + '">#' + tag.name + '</a>';
    }).join(' ');
    return '' +
      '<article class="card">' +
      '<svg class="thumb" viewBox="0 0 70 70" xmlns="http://www.w3.org/2000/svg">' + t.thumb + '</svg>' +
      '<div>' +
      themeHTML +
      '<h3><a href="' + t.url + '">' + t.title +
      '<svg class="chev" viewBox="0 0 9 14" aria-hidden="true"><path d="M0,0 L5,7 L0,14" fill="none" stroke="#3ecf6e" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg></a></h3>' +
      '<p>' + t.excerpt + '</p>' +
      '<div class="meta">' + t.date.replace(/-/g, ".") + ' ・ 読了目安 ' + t.readMin + '分</div>' +
      '<div class="topic-tags">' + tagsHTML + '</div>' +
      '</div>' +
      '</article>';
  }

  function render() {
    var list = filtered();
    var totalPages = Math.max(1, Math.ceil(list.length / PAGE_SIZE));
    if (state.page > totalPages) state.page = totalPages;
    var start = (state.page - 1) * PAGE_SIZE;
    var pageItems = list.slice(start, start + PAGE_SIZE);

    document.getElementById("topics-list").innerHTML = pageItems.length
      ? pageItems.map(cardHTML).join("")
      : '<p style="color:var(--text-dim); padding:40px 0;">条件に一致するトピックスがありません。</p>';

    document.querySelectorAll("#theme-filter .tag-pill").forEach(function (btn) {
      btn.classList.toggle("is-active", btn.dataset.slug === state.theme);
    });
    document.querySelectorAll("#tag-filter .tag-pill").forEach(function (btn) {
      btn.classList.toggle("is-active", state.tags.indexOf(btn.dataset.slug) !== -1);
    });

    var statusParts = [];
    if (state.theme) {
      var th = uniqueThemes().filter(function (x) { return x.slug === state.theme; })[0];
      if (th) statusParts.push("テーマ: " + th.name);
    }
    if (state.tags.length) {
      var names = state.tags.map(function (slug) {
        var found = uniqueTags().filter(function (x) { return x.slug === slug; })[0];
        return found ? "#" + found.name : slug;
      });
      statusParts.push("タグ: " + names.join(" "));
    }
    document.getElementById("filter-status").textContent = statusParts.length
      ? statusParts.join(" ・ ") + "（" + list.length + "件）"
      : "全" + list.length + "件";
    document.getElementById("filter-reset-top").hidden = statusParts.length === 0;
    document.getElementById("filter-reset").hidden = statusParts.length === 0;

    renderPagination(totalPages);
  }

  function renderPagination(totalPages) {
    var nav = document.getElementById("pagination");
    nav.innerHTML = "";
    if (totalPages <= 1) return;

    var prev = document.createElement("button");
    prev.textContent = "前へ";
    prev.disabled = state.page === 1;
    prev.addEventListener("click", function () { state.page--; render(); window.scrollTo({ top: 0, behavior: "smooth" }); });
    nav.appendChild(prev);

    for (var p = 1; p <= totalPages; p++) {
      (function (p) {
        var btn = document.createElement("button");
        btn.textContent = String(p);
        btn.className = p === state.page ? "is-active" : "";
        btn.addEventListener("click", function () { state.page = p; render(); window.scrollTo({ top: 0, behavior: "smooth" }); });
        nav.appendChild(btn);
      })(p);
    }

    var next = document.createElement("button");
    next.textContent = "次へ";
    next.disabled = state.page === totalPages;
    next.addEventListener("click", function () { state.page++; render(); window.scrollTo({ top: 0, behavior: "smooth" }); });
    nav.appendChild(next);
  }

  document.addEventListener("DOMContentLoaded", function () {
    state.theme = getParam("theme");
    var tagParam = getParam("tag");
    state.tags = tagParam ? [tagParam] : [];
    buildFilterUI();
    render();
  });
})();
</script>
